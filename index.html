<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXf89w-BrrpaRTaOVf5OznjtCHiY3dRDc",
    authDomain: "car-request-app-9cad4.firebaseapp.com",
    projectId: "car-request-app-9cad4",
    storageBucket: "car-request-app-9cad4.firebasestorage.app",
    messagingSenderId: "398751381961",
    appId: "1:398751381961:web:7e9636defe2e8db54c9018",
    measurementId: "G-XRE4NQHXTC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fb = { db, collection, addDoc, updateDoc, doc };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(()=>{});
  }

  onSnapshot(collection(db, "users"), (snapshot) => {
    S.dbUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });

  let prevReqsMap = {};
  let isFirstLoad = true;

  onSnapshot(collection(db, "requests"), (snapshot) => {
    const newReqs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    
    if (!isFirstLoad && S.user) {
      snapshot.docChanges().forEach(change => {
        const data = change.doc.data();
        const reqId = change.doc.id;

        if (change.type === "added" && S.user.role === 'admin') {
          playBeepSound();
          showPushNotification("طلب جديد 🚗", `قام ${data.empName} بتقديم طلب سيارة جديد.`);
        }

        if (change.type === "modified") {
          const oldData = prevReqsMap[reqId];
          if (!oldData) return;

          if (oldData.status === 'pending' && data.status === 'approved') {
            if (S.user.id === data.empId) {
              playBeepSound();
              showPushNotification("تم قبول طلبك ✅", `وافق الإداري على طلبك وتم تعيين السائق ${data.driverName}.`);
            }
            if (S.user.id === data.driverId) {
              playBeepSound();
              showPushNotification("مهمة توصيل جديدة 🚙", `تم تكليفك برحلة جديدة من ${data.from} إلى ${data.to}.`);
            }
          }

          if (oldData.status === 'approved' && data.status === 'in_progress') {
            if (S.user.id === data.empId || S.user.role === 'admin') {
              playBeepSound();
              showPushNotification("الرحلة قيد التنفيذ 🚀", `بدأ السائق ${data.driverName} الرحلة المتجهة إلى ${data.to}.`);
            }
          }

          if (oldData.status === 'in_progress' && data.status === 'completed') {
            if (S.user.id === data.empId || S.user.role === 'admin') {
              playBeepSound();
              showPushNotification("تمت الرحلة 🏁", `أكمل السائق ${data.driverName} الرحلة بنجاح.`);
            }
          }
        }
      });
    }

    newReqs.forEach(r => { prevReqsMap[r.id] = r; });
    S.reqs = newReqs;
    isFirstLoad = false;
    render();
  });
</script>

<script>
const LOGO_URL = 'https://img.icons8.com/isometric/512/car.png';

const savedUser = JSON.parse(localStorage.getItem('car_app_user') || 'null');

const S={
  user: savedUser,
  authMode: 'login',
  msg: {err:'', ok:''},
  showModal: false,
  reqs: [],
  dbUsers: []
};

function getAllUsers() {
  return S.dbUsers;
}

function playBeepSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

function showPushNotification(title, body) {
  if ("Notification" in window && Notification.permission === "granted") {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(registration => {
        registration.showNotification(title, {
          body: body,
          icon: LOGO_URL,
          vibrate: [200, 100, 200]
        });
      });
    } else {
      new Notification(title, { body, icon: LOGO_URL });
    }
  }
}

function requestNotifPermission() {
  if ("Notification" in window) {
    Notification.requestPermission();
  }
}

function bdg(s){
  const m={pending:['b-pend','قيد الانتظار'],approved:['b-appr','موافق عليه'],in_progress:['b-prog','قيد التنفيذ'],completed:['b-done','مكتمل']};
  const[c,l]=m[s]||['b-pend',s];
  return`<span class="badge ${c}">${l}</span>`;
}

function today(){const d=new Date();return`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;}

window.exportToExcel = function() {
  if (!typeof XLSX !== 'undefined' && !window.XLSX) {
    alert("جارٍ تحميل مكتبة التصدير، يرجى المحاولة بعد لحظات...");
    return;
  }

  if (!S.reqs || S.reqs.length === 0) {
    alert("لا توجد رحلات مسجلة في النظام لتصديرها حالياً.");
    return;
  }

  const statusMap = {
    pending: 'قيد الانتظار',
    approved: 'موافق عليه',
    in_progress: 'قيد التنفيذ',
    completed: 'مكتمل'
  };

  const excelData = S.reqs.map((r, index) => ({
    "م": index + 1,
    "التاريخ": r.date || 'غير محدد',
    "اسم الموظف": r.empName || '—',
    "نقطة الانطلاق (من)": r.from || '—',
    "الوجهة (إلى)": r.to || '—',
    "السائق المكلف": r.driverName || 'لم يتم التعيين',
    "حالة الطلب": statusMap[r.status] || r.status,
    "السبب / الملاحظات": r.reason || '—'
  }));

  const worksheet = XLSX.utils.json_to_sheet(excelData);

  if (!worksheet['!views']) worksheet['!views'] = [];
  worksheet['!views'].push({ RTL: true });

  worksheet['!cols'] = [
    { wch: 5 },
    { wch: 12 },
    { wch: 22 },
    { wch: 20 },
    { wch: 20 },
    { wch: 22 },
    { wch: 15 },
    { wch: 30 }
  ];

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "تقرير الرحلات");

  const dateStr = new Date().toISOString().split('T')[0];
  XLSX.writeFile(workbook, `تقرير_طلبات_السيارات_${dateStr}.xlsx`);
};

      <img src="${LOGO_URL}" alt="Hassan Allam Construction" class="company-logo"/>
      <div class="brand-divider"></div>
      <div>
        <div class="hdr-title">نظام إدارة الانتقالات والسيارات</div>
        <div class="by-text">Created by Mohanad Marzok</div>
      </div>
    </div>
    ${S.user ? `<div style="display:flex;align-items:center;gap:12px">
      <span style="font-size:13px;font-weight:600;color:#334155">${S.user.name}</span>
      <button class="btn btn-sm" onclick="logout()">خروج</button>
    </div>` : ''}
  </div>`;
}

function renderFooter(){
  return `<div class="footer">Hassan Allam Construction &copy; 2026 | Created by Mohanad Marzok</div>`;
}

function render(){
  const app=document.getElementById('app');
  let content = '';
  if(!S.user) content = renderHome();
  else if(S.user.role==='employee') content = renderEmployee();
  else if(S.user.role==='admin') content = renderAdmin();
  else if(S.user.role==='driver') content = renderDriver();
  
  app.innerHTML = content + renderFooter();
}

        `}
      </div>

    <div class="form-grp"><label class="form-lbl">السبب / ملاحظات</label><textarea class="form-inp" id="m-reason" rows="3"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-blue btn-sm" onclick="submitReq()">إرسال الطلب</button>
    </div>
  </div></div>`:'';
  return`${renderHeader()}${modal}
<div class="main">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2 style="font-size:18px;font-weight:700">طلباتي الحالية</h2>

  const drivers = getAllUsers().filter(u => u.role === 'driver');

function renderDriver(){
  const u=S.user;
  const myR=S.reqs.filter(r=>r.driverId===u.id);
  return`${renderHeader()}
<div class="main">
  <h2 style="font-size:18px;font-weight:700;margin-bottom:16px">قائمة الرحلات المكلف بها</h2>

function setAuthMode(mode) {
  S.authMode = mode;
  S.msg = {err:'', ok:''};
  render();
}

function doLogin(){
  const email=document.getElementById('f-email')?.value.trim();
  const pass=document.getElementById('f-pass')?.value;
  const u = getAllUsers().find(x=>x.email===email && x.pass===pass);
  
  if(!u){
    S.msg={err:'البريد الإلكتروني أو كلمة المرور غير صحيحة'};
    render();
    return;
  }
  
  S.user=u;
  localStorage.setItem('car_app_user', JSON.stringify(u));
  requestNotifPermission();
  render();
}

async function doRegister(){
  const name = document.getElementById('r-name')?.value.trim();
  const email = document.getElementById('r-email')?.value.trim();
  const pass = document.getElementById('r-pass')?.value;
  const role = document.getElementById('r-role')?.value;

  if(!name || !email || !pass){
    S.msg = {err: 'يرجى ملء جميع الحقول المطلوبة'};
    render();
    return;
  }

  const existing = getAllUsers().find(x => x.email === email);
  if(existing){
    S.msg = {err: 'هذا البريد الإلكتروني مسجل بالفعل'};
    render();
    return;
  }

  try {
    const newUser = { name, email, pass, role };
    const docRef = await window.fb.addDoc(window.fb.collection(window.fb.db, "users"), newUser);
    newUser.id = docRef.id;

    S.user = newUser;
    localStorage.setItem('car_app_user', JSON.stringify(newUser));
    S.msg = {ok: 'تم إنشاء الحساب بنجاح!'};
    requestNotifPermission();
    render();
  } catch(e) {
    S.msg = {err: 'حدث خطأ أثناء إنشاء الحساب: ' + e.message};
    render();
  }
}

function logout(){
  S.user=null;
  localStorage.removeItem('car_app_user');
  render();
}

function openModal(){S.showModal=true;render();}
function closeModal(){S.showModal=false;render();}

async function submitReq(){
  const from=document.getElementById('m-from')?.value.trim();
  const to=document.getElementById('m-to')?.value.trim();
  const reason=document.getElementById('m-reason')?.value.trim();
  if(!from||!to) return;
  try {
    await window.fb.addDoc(window.fb.collection(window.fb.db, "requests"), {
      empId: S.user.id,
      empName: S.user.name,
      from: from,
      to: to,
      reason: reason || '',
      status: 'pending',
      driverId: null,
      driverName: null,
      date: today()
    });
    S.showModal=false;
    render();
  } catch (e) {
    alert("حدث خطأ أثناء الإرسال: " + e.message);
  }
}

async function approve(rId){
  const sel=document.getElementById('ds-'+rId);
  const dId=sel?.value;
  if(!dId){alert('اختر سائق أولاً');return;}
  const d=getAllUsers().find(x=>x.id===dId);
  await window.fb.updateDoc(window.fb.doc(window.fb.db, "requests", rId), {
    status:'approved',driverId:dId,driverName:d?.name
  });
}

async function startR(rId){
  await window.fb.updateDoc(window.fb.doc(window.fb.db, "requests", rId), { status:'in_progress' });
}

async function doneR(rId){
  await window.fb.updateDoc(window.fb.doc(window.fb.db, "requests", rId), { status:'completed' });
}

render();
</script>
</body>
