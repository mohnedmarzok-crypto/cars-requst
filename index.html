<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نظام إدارة طلبات السيارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;direction:rtl;background:#F5F5F3;min-height:100vh}
.hdr{background:#fff;border-bottom:1px solid #E5E5E2;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ic-b{background:#E6F1FB}.ic-p{background:#EEEDFE}.ic-g{background:#EAF3DE}
.hdr-title{font-size:15px;font-weight:500;color:#1A1A18}
.hdr-sub{font-size:11px;color:#888780}
.btn{padding:6px 14px;border-radius:8px;border:1px solid #D3D1C7;background:#fff;color:#1A1A18;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.btn:hover{background:#F1EFE8}
.btn-blue{background:#185FA5;color:#fff;border-color:#185FA5}.btn-blue:hover{background:#0C447C}
.btn-green{background:#3B6D11;color:#fff;border-color:#3B6D11}.btn-green:hover{background:#27500A}
.btn-red{background:#A32D2D;color:#fff;border-color:#A32D2D}.btn-red:hover{background:#791F1F}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-full{width:100%;text-align:center;padding:9px;font-size:14px}
.main{max-width:920px;margin:0 auto;padding:16px 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stat{background:#fff;border-radius:8px;padding:12px 14px;border:1px solid #E5E5E2}
.stat-l{font-size:11px;color:#888780;margin-bottom:4px}
.stat-v{font-size:24px;font-weight:500;color:#1A1A18}
.stat-v.y{color:#854F0B}.stat-v.b{color:#185FA5}.stat-v.g{color:#3B6D11}
.card{background:#fff;border:1px solid #E5E5E2;border-radius:12px;margin-bottom:12px}
.card-hdr{padding:12px 16px;border-bottom:1px solid #E5E5E2;display:flex;justify-content:space-between;align-items:center}
.card-title{font-size:14px;font-weight:500;color:#1A1A18}
.card-desc{font-size:11px;color:#888780}
.card-body{padding:14px 16px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-pend{background:#FAEEDA;color:#854F0B}
.b-appr{background:#E6F1FB;color:#0C447C}
.b-rjct{background:#FCEBEB;color:#791F1F}
.b-prog{background:#EEEDFE;color:#3C3489}
.b-done{background:#EAF3DE;color:#27500A}
.req-item{border:1px solid #E5E5E2;border-radius:8px;padding:12px;margin-bottom:8px}
.req-item:last-child{margin-bottom:0}
.req-row{display:flex;justify-content:space-between;align-items:flex-start}
.req-from{font-size:13px;font-weight:500;color:#1A1A18}
.req-reason{font-size:11px;color:#888780;margin-top:3px}
.req-meta{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.req-date{font-size:11px;color:#888780}
.actions{display:flex;gap:6px;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:8px 10px;color:#888780;font-weight:500;border-bottom:1px solid #E5E5E2;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #E5E5E2;color:#1A1A18;vertical-align:middle}
tr:last-child td{border-bottom:none}
select.drv-sel{padding:4px 7px;font-size:12px;border-radius:8px;border:1px solid #D3D1C7;background:#fff;width:100%}
.notif-wrap{position:relative;display:inline-block}
.notif-panel{position:absolute;top:40px;left:0;width:290px;background:#fff;border:1px solid #E5E5E2;border-radius:12px;z-index:50;max-height:300px;overflow-y:auto;box-shadow:0 4px 16px rgba(0,0,0,.1)}
.notif-hdr{padding:10px 14px;border-bottom:1px solid #E5E5E2;font-size:13px;font-weight:500}
.notif-item{padding:10px 14px;border-bottom:1px solid #E5E5E2;cursor:pointer}
.notif-item:hover{background:#F5F5F3}
.notif-item.unread{background:#E6F1FB}
.notif-t{font-size:13px;font-weight:500}
.notif-m{font-size:12px;color:#5F5E5A;margin-top:2px}
.badge-cnt{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;background:#A32D2D;color:#fff;border-radius:50%;font-size:10px;margin-right:3px;vertical-align:middle}
.empty{text-align:center;padding:24px;color:#888780;font-size:13px}
.land{max-width:920px;margin:0 auto;padding:30px 20px}
.land-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media(max-width:640px){.land-grid{grid-template-columns:1fr}}
.feat-list{display:flex;flex-direction:column;gap:10px;margin-top:16px}
.feat-card{background:#fff;border:1px solid #E5E5E2;border-radius:12px;padding:14px 16px;display:flex;align-items:flex-start;gap:12px}
.feat-icon{width:36px;height:36px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.feat-title{font-size:13px;font-weight:500;color:#1A1A18}
.feat-desc{font-size:12px;color:#5F5E5A;margin-top:2px}
.auth-card{background:#fff;border:1px solid #E5E5E2;border-radius:12px;padding:20px}
.tab-row{display:flex;gap:6px;margin-bottom:16px}
.tab-btn{flex:1;padding:8px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.tab-btn.on{background:#185FA5;color:#fff}
.tab-btn.off{background:#F1EFE8;color:#5F5E5A}
.form-grp{margin-bottom:11px}
.form-lbl{font-size:12px;color:#5F5E5A;display:block;margin-bottom:4px;font-weight:500}
.form-inp{width:100%;padding:9px 11px;border-radius:8px;border:1px solid #D3D1C7;background:#fff;color:#1A1A18;font-size:13px;font-family:inherit}
.form-inp:focus{outline:none;border-color:#185FA5}
.err-msg{background:#FCEBEB;color:#791F1F;border:1px solid #F7C1C1;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.ok-msg{background:#EAF3DE;color:#27500A;border:1px solid #C0DD97;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.hint-box{background:#F5F5F3;border-radius:8px;padding:10px 14px;font-size:12px;color:#5F5E5A;margin-top:14px;line-height:1.8;border:1px solid #E5E5E2}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:#fff;border:1px solid #E5E5E2;border-radius:12px;padding:20px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-title{font-size:15px;font-weight:500;color:#1A1A18;margin-bottom:3px}
.modal-desc{font-size:12px;color:#888780;margin-bottom:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.footer{background:#2C2C2A;color:#888780;text-align:center;padding:12px;font-size:11px;margin-top:20px}
</style>
</head>
<body>
<div id="app"></div>

<!-- Firebase SDKs -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXf89w-BrrpaRTaOVf5OznjtCHiY3dRDc",
    authDomain: "car-request-app-9cad4.firebaseapp.com",
    projectId: "car-request-app-9cad4",
    storageBucket: "car-request-app-9cad4.firebasestorage.app",
    messagingSenderId: "398751381961",
    appId: "1:398751381961:web:7e9636defe2e8db54c9018",
    measurementId: "G-XRE4NQHXTC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.db = db;
  window.addDoc = addDoc;
  window.updateDoc = updateDoc;
  window.doc = doc;
  window.collection = collection;

  // Realtime Sync with Firestore
  const reqsRef = collection(db, "requests");
  onSnapshot(reqsRef, (snapshot) => {
    S.reqs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });
</script>

<script>
const USERS=[
  {id:1,name:'أحمد الموظف',email:'ahmed@company.com',pass:'Emp@1234',role:'employee'},
  {id:2,name:'فاطمة الموظفة',email:'fatima@company.com',pass:'Emp@1234',role:'employee'},
  {id:4,name:'محمد الإداري',email:'admin@company.com',pass:'Admin@1234',role:'admin'},
  {id:5,name:'عمر السائق',email:'omar@company.com',pass:'Driver@1234',role:'driver'},
  {id:6,name:'جمال السائق',email:'jamal@company.com',pass:'Driver@1234',role:'driver'},
];
const DRIVERS=[
  {id:1,userId:5,name:'عمر السائق'},
  {id:2,userId:6,name:'جمال السائق'},
];
const S={
  user:null,mode:'login',
  form:{email:'',pass:'',name:'',role:'employee'},
  msg:{err:'',ok:''},
  showModal:false,showNotif:false,selDrv:{},
  reqs:[],notifs:[]
};

function bdg(s){
  const m={pending:['b-pend','قيد الانتظار'],approved:['b-appr','موافق عليه'],rejected:['b-rjct','مرفوض'],in_progress:['b-prog','قيد التنفيذ'],completed:['b-done','مكتمل']};
  const[c,l]=m[s]||['b-pend',s];
  return`<span class="badge ${c}">${l}</span>`;
}

function today(){const d=new Date();return`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;}

function render(){
  const app=document.getElementById('app');
  if(!S.user) app.innerHTML=renderHome();
  else if(S.user.role==='employee') app.innerHTML=renderEmployee();
  else if(S.user.role==='admin') app.innerHTML=renderAdmin();
  else if(S.user.role==='driver') app.innerHTML=renderDriver();
}

function renderHome(){
  const isL=S.mode==='login';
  return`
<div class="land">
  <div class="land-grid">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="hdr-icon ic-b">🚗</div>
        <div style="font-size:20px;font-weight:500;color:#1A1A18">نظام إدارة طلبات السيارات</div>
      </div>
      <p style="font-size:13px;color:#5F5E5A;line-height:1.6;margin-bottom:16px">نظام متكامل ومربوط لحظياً لنقل الطلبات والإشعارات</p>
      <div class="hint-box">
        <b>حسابات الدخول:</b><br>
        إداري: admin@company.com / Admin@1234<br>
        موظف: ahmed@company.com / Emp@1234<br>
        سائق: omar@company.com / Driver@1234
      </div>
    </div>
    <div>
      <div class="auth-card">
        <div class="auth-title">تسجيل الدخول</div>
        ${S.msg.err?`<div class="err-msg">${S.msg.err}</div>`:''}
        <div class="form-grp"><label class="form-lbl">البريد الإلكتروني</label>
        <input class="form-inp" type="email" id="f-email" placeholder="example@company.com" value="${S.form.email}"/></div>
        <div class="form-grp"><label class="form-lbl">كلمة المرور</label>
        <input class="form-inp" type="password" id="f-pass" placeholder="••••••••"/></div>
        <button class="btn btn-blue btn-full" onclick="doLogin()">دخول</button>
      </div>
    </div>
  </div>
</div>`;
}

function renderEmployee(){
  const u=S.user;
  const myR=S.reqs.filter(r=>r.empId===u.id);
  const modal=S.showModal?`<div class="modal-overlay"><div class="modal-box">
    <div class="modal-title">طلب سيارة جديدة</div>
    <div class="form-grp"><label class="form-lbl">من</label><input class="form-inp" id="m-from"/></div>
    <div class="form-grp"><label class="form-lbl">إلى</label><input class="form-inp" id="m-to"/></div>
    <div class="form-grp"><label class="form-lbl">السبب</label><textarea class="form-inp" id="m-reason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-blue btn-sm" onclick="submitReq()">إرسال الطلب</button>
    </div>
  </div></div>`:'';
  return`${modal}
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-icon ic-b">🚗</div><div><div class="hdr-title">لوحة الموظف</div><div class="hdr-sub">${u.name}</div></div></div>
  <button class="btn btn-sm" onclick="logout()">خروج</button>
</div>
<div class="main">
  <button class="btn btn-blue" style="margin-bottom:12px" onclick="openModal()">+ طلب سيارة جديدة</button>
  <div class="card"><div class="card-body">${myR.map(r=>`<div class="req-item">
    <div class="req-row"><div>من: ${r.from} &rarr; ${r.to}</div>${bdg(r.status)}</div>
  </div>`).join('')||'<div class="empty">لا توجد طلبات</div>'}</div></div>
</div>`;
}

function renderAdmin(){
  return`
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-icon ic-p">🛡️</div><div><div class="hdr-title">لوحة الإداري</div></div></div>
  <button class="btn btn-sm" onclick="logout()">خروج</button>
</div>
<div class="main">
  <div class="card"><div class="card-body"><table>
    <thead><tr><th>الموظف</th><th>الوجهة</th><th>الحالة</th><th>السائق</th><th>إجراء</th></tr></thead>
    <tbody>${S.reqs.map(r=>`<tr>
      <td>${r.empName}</td>
      <td>${r.from} → ${r.to}</td>
      <td>${bdg(r.status)}</td>
      <td>${r.status==='pending'?`<select class="drv-sel" id="ds-${r.id}"><option value="">اختر سائق</option>${DRIVERS.map(d=>`<option value="${d.userId}">${d.name}</option>`).join('')}</select>`:(r.driverName||'—')}</td>
      <td>${r.status==='pending'?`<button class="btn btn-green btn-sm" onclick="approve('${r.id}')">موافقة وتحويل</button>`:'تم'}</td>
    </tr>`).join('')}</tbody>
  </table></div></div>
</div>`;
}

function renderDriver(){
  const u=S.user;
  const myR=S.reqs.filter(r=>r.driverId===u.id);
  return`
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-icon ic-g">🚙</div><div><div class="hdr-title">لوحة السائق</div><div class="hdr-sub">${u.name}</div></div></div>
  <button class="btn btn-sm" onclick="logout()">خروج</button>
</div>
<div class="main">
  <div class="card"><div class="card-body">${myR.map(r=>`<div class="req-item">
    <div class="req-row"><div>من: ${r.from} &rarr; ${r.to}</div>${bdg(r.status)}</div>
    ${r.status==='approved'?`<button class="btn btn-blue btn-full" style="margin-top:8px" onclick="startR('${r.id}')">▶ استلام الطلب</button>`:''}
    ${r.status==='in_progress'?`<button class="btn btn-green btn-full" style="margin-top:8px" onclick="doneR('${r.id}')">✓ تم التنفيذ</button>`:''}
  </div>`).join('')||'<div class="empty">لا توجد رحلات حالياً</div>'}</div></div>
</div>`;
}

function doLogin(){
  const email=document.getElementById('f-email')?.value.trim();
  const pass=document.getElementById('f-pass')?.value;
  const u=USERS.find(x=>x.email===email&&x.pass===pass);
  if(!u){S.msg={err:'البيانات غير صحيحة'};render();return;}
  S.user=u;render();
}

function logout(){S.user=null;render();}
function openModal(){S.showModal=true;render();}
function closeModal(){S.showModal=false;render();}

async function submitReq(){
  const from=document.getElementById('m-from')?.value.trim();
  const to=document.getElementById('m-to')?.value.trim();
  const reason=document.getElementById('m-reason')?.value.trim();
  if(!from||!to) return;
  await window.addDoc(window.collection(window.db, "requests"), {
    empId:S.user.id,empName:S.user.name,from,to,reason:reason||'',status:'pending',driverId:null,driverName:null,date:today()
  });
  S.showModal=false;
}

async function approve(rId){
  const sel=document.getElementById('ds-'+rId);
  const dId=parseInt(sel?.value);
  if(!dId){alert('اختر سائق');return;}
  const d=DRIVERS.find(x=>x.userId===dId);
  await window.updateDoc(window.doc(window.db, "requests", rId), {
    status:'approved',driverId:dId,driverName:d?.name
  });
}

async function startR(rId){
  await window.updateDoc(window.doc(window.doc(window.db, "requests", rId)), { status:'in_progress' });
}

async function doneR(rId){
  await window.updateDoc(window.doc(window.doc(window.db, "requests", rId)), { status:'completed' });
}

render();
</script>
</body>
</html>
