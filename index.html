<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>نظام إدارة طلبات السيارات</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Arial,sans-serif;direction:rtl;background:#F5F5F3;min-height:100vh}
.hdr{background:#fff;border-bottom:1px solid #E5E5E2;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr-icon{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.ic-b{background:#E6F1FB}.ic-p{background:#EEEDFE}.ic-g{background:#EAF3DE}
.hdr-title{font-size:15px;font-weight:500;color:#1A1A18}
.hdr-sub{font-size:11px;color:#888780}
.btn{padding:6px 14px;border-radius:8px;border:1px solid #D3D1C7;background:#fff;color:#1A1A18;cursor:pointer;font-size:13px;font-weight:500;transition:background .15s}
.btn:hover{background:#F1EFE8}
.btn-blue{background:#185FA5;color:#fff;border-color:#185FA5}.btn-blue:hover{background:#0C447C}
.btn-green{background:#3B6D11;color:#fff;border-color:#3B6D11}.btn-green:hover{background:#27500A}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-full{width:100%;text-align:center;padding:9px;font-size:14px}
.main{max-width:920px;margin:0 auto;padding:16px 20px}
.card{background:#fff;border:1px solid #E5E5E2;border-radius:12px;margin-bottom:12px}
.card-body{padding:14px 16px}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500}
.b-pend{background:#FAEEDA;color:#854F0B}
.b-appr{background:#E6F1FB;color:#0C447C}
.b-prog{background:#EEEDFE;color:#3C3489}
.b-done{background:#EAF3DE;color:#27500A}
.req-item{border:1px solid #E5E5E2;border-radius:8px;padding:12px;margin-bottom:8px}
.req-row{display:flex;justify-content:space-between;align-items:flex-start}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;padding:8px 10px;color:#888780;font-weight:500;border-bottom:1px solid #E5E5E2;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid #E5E5E2;color:#1A1A18;vertical-align:middle}
select.drv-sel{padding:4px 7px;font-size:12px;border-radius:8px;border:1px solid #D3D1C7;background:#fff;width:100%}
.empty{text-align:center;padding:24px;color:#888780;font-size:13px}
.land{max-width:920px;margin:0 auto;padding:30px 20px}
.land-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start}
@media(max-width:640px){.land-grid{grid-template-columns:1fr}}
.auth-card{background:#fff;border:1px solid #E5E5E2;border-radius:12px;padding:20px}
.auth-tabs{display:flex;gap:8px;margin-bottom:16px;border-bottom:1px solid #E5E5E2;padding-bottom:10px}
.auth-tab{padding:6px 12px;font-size:13px;font-weight:500;border:none;background:none;cursor:pointer;color:#888780}
.auth-tab.active{color:#185FA5;border-bottom:2px solid #185FA5}
.form-grp{margin-bottom:11px}
.form-lbl{font-size:12px;color:#5F5E5A;display:block;margin-bottom:4px;font-weight:500}
.form-inp{width:100%;padding:9px 11px;border-radius:8px;border:1px solid #D3D1C7;background:#fff;color:#1A1A18;font-size:13px;font-family:inherit}
.err-msg{background:#FCEBEB;color:#791F1F;border:1px solid #F7C1C1;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.ok-msg{background:#EAF3DE;color:#27500A;border:1px solid #C0DD97;border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:10px}
.hint-box{background:#F5F5F3;border-radius:8px;padding:10px 14px;font-size:12px;color:#5F5E5A;margin-top:14px;line-height:1.8;border:1px solid #E5E5E2}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:200}
.modal-box{background:#fff;border:1px solid #E5E5E2;border-radius:12px;padding:20px;width:360px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
.modal-title{font-size:15px;font-weight:500;color:#1A1A18;margin-bottom:10px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDXf89w-BrrpaRTaOVf5OznjtCHiY3dRDc",
    authDomain: "car-request-app-9cad4.firebaseapp.com",
    projectId: "car-request-app-9cad4",
    storageBucket: "car-request-app-9cad4.firebasestorage.app",
    messagingSenderId: "398751381961",
    appId: "1:398751381961:web:7e9636defe2e8db54c9018",
    measurementId: "G-XRE4NQHXTC"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fb = { db, collection, addDoc, updateDoc, doc };

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/firebase-messaging-sw.js').catch(()=>{});
  }

  // الاستماع لقائمة المستخدمين
  onSnapshot(collection(db, "users"), (snapshot) => {
    S.dbUsers = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    render();
  });

  let prevReqsMap = {};
  let isFirstLoad = true;

  // متابعة التغييرات وتنبيه كل مستخدم حسب دوره
  onSnapshot(collection(db, "requests"), (snapshot) => {
    const newReqs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    
    if (!isFirstLoad && S.user) {
      snapshot.docChanges().forEach(change => {
        const data = change.doc.data();
        const reqId = change.doc.id;

        if (change.type === "added" && S.user.role === 'admin') {
          // إشعار للإداري بطلب جديد
          playBeepSound();
          showPushNotification("طلب جديد 🚗", `قام ${data.empName} بتقديم طلب سيارة جديد.`);
        }

        if (change.type === "modified") {
          const oldData = prevReqsMap[reqId];
          if (!oldData) return;

          // 1. عند الموافقة وتعيين السائق
          if (oldData.status === 'pending' && data.status === 'approved') {
            if (S.user.id === data.empId) {
              playBeepSound();
              showPushNotification("تم قبول طلبك ✅", `وافق الإداري على طلبك وتم تعيين السائق ${data.driverName}.`);
            }
            if (S.user.id === data.driverId) {
              playBeepSound();
              showPushNotification("مهمة توصيل جديدة 🚙", `تم تكليفك برحلة جديدة من ${data.from} إلى ${data.to}.`);
            }
          }

          // 2. عند استلام الرحلة وبدء التنفيذ
          if (oldData.status === 'approved' && data.status === 'in_progress') {
            if (S.user.id === data.empId || S.user.role === 'admin') {
              playBeepSound();
              showPushNotification("الرحلة قيد التنفيذ 🚀", `بدأ السائق ${data.driverName} الرحلة المتجهة إلى ${data.to}.`);
            }
          }

          // 3. عند إنهاء الرحلة
          if (oldData.status === 'in_progress' && data.status === 'completed') {
            if (S.user.id === data.empId || S.user.role === 'admin') {
              playBeepSound();
              showPushNotification("تمت الرحلة 🏁", `أكمل السائق ${data.driverName} الرحلة بنجاح.`);
            }
          }
        }
      });
    }

    // حفظ الحالة الحالية للطلبات
    newReqs.forEach(r => { prevReqsMap[r.id] = r; });
    S.reqs = newReqs;
    isFirstLoad = false;
    render();
  });
</script>

<script>
const INITIAL_USERS=[
  {id:'u1',name:'أحمد الموظف',email:'ahmed@company.com',pass:'Emp@1234',role:'employee'},
  {id:'u2',name:'فاطمة الموظفة',email:'fatima@company.com',pass:'Emp@1234',role:'employee'},
  {id:'u4',name:'محمد الإداري',email:'admin@company.com',pass:'Admin@1234',role:'admin'},
  {id:'u5',name:'عمر السائق',email:'omar@company.com',pass:'Driver@1234',role:'driver'},
  {id:'u6',name:'جمال السائق',email:'jamal@company.com',pass:'Driver@1234',role:'driver'},
];

const savedUser = JSON.parse(localStorage.getItem('car_app_user') || 'null');

const S={
  user: savedUser,
  authMode: 'login',
  msg: {err:'', ok:''},
  showModal: false,
  reqs: [],
  dbUsers: []
};

function getAllUsers() {
  return [...INITIAL_USERS, ...S.dbUsers];
}

function playBeepSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  } catch(e) {}
}

function showPushNotification(title, body) {
  if ("Notification" in window && Notification.permission === "granted") {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.ready.then(registration => {
        registration.showNotification(title, {
          body: body,
          icon: 'https://cdn-icons-png.flaticon.com/512/744/744465.png',
          vibrate: [200, 100, 200]
        });
      });
    } else {
      new Notification(title, { body, icon: 'https://cdn-icons-png.flaticon.com/512/744/744465.png' });
    }
  }
}

function requestNotifPermission() {
  if ("Notification" in window) {
    Notification.requestPermission();
  }
}

function bdg(s){
  const m={pending:['b-pend','قيد الانتظار'],approved:['b-appr','موافق عليه'],in_progress:['b-prog','قيد التنفيذ'],completed:['b-done','مكتمل']};
  const[c,l]=m[s]||['b-pend',s];
  return`<span class="badge ${c}">${l}</span>`;
}

function today(){const d=new Date();return`${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;}

function render(){
  const app=document.getElementById('app');
  if(!S.user) app.innerHTML=renderHome();
  else if(S.user.role==='employee') app.innerHTML=renderEmployee();
  else if(S.user.role==='admin') app.innerHTML=renderAdmin();
  else if(S.user.role==='driver') app.innerHTML=renderDriver();
}

function renderHome(){
  const isLogin = S.authMode === 'login';
  return`
<div class="land">
  <div class="land-grid">
    <div>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
        <div class="hdr-icon ic-b">🚗</div>
        <div style="font-size:20px;font-weight:500;color:#1A1A18">نظام إدارة طلبات السيارات</div>
      </div>
      <p style="font-size:13px;color:#5F5E5A;line-height:1.6;margin-bottom:16px">نظام متكامل ومربوط بجميع الإشعارات الصوتية واللحظية لكل أدوار النظام</p>
      <div class="hint-box">
        <b>الحسابات الافتراضية:</b><br>
        إداري: admin@company.com / Admin@1234<br>
        موظف: ahmed@company.com / Emp@1234<br>
        سائق: omar@company.com / Driver@1234
      </div>
    </div>
    <div>
      <div class="auth-card">
        <div class="auth-tabs">
          <button class="auth-tab ${isLogin?'active':''}" onclick="setAuthMode('login')">تسجيل الدخول</button>
          <button class="auth-tab ${!isLogin?'active':''}" onclick="setAuthMode('register')">حساب جديد</button>
        </div>
        ${S.msg.err?`<div class="err-msg">${S.msg.err}</div>`:''}
        ${S.msg.ok?`<div class="ok-msg">${S.msg.ok}</div>`:''}
        
        ${isLogin ? `
          <div class="form-grp"><label class="form-lbl">البريد الإلكتروني</label>
          <input class="form-inp" type="email" id="f-email" placeholder="example@company.com"/></div>
          <div class="form-grp"><label class="form-lbl">كلمة المرور</label>
          <input class="form-inp" type="password" id="f-pass" placeholder="••••••••"/></div>
          <button class="btn btn-blue btn-full" onclick="doLogin()">دخول</button>
        ` : `
          <div class="form-grp"><label class="form-lbl">الاسم الكامل</label>
          <input class="form-inp" type="text" id="r-name" placeholder="أدخل اسمك الكامل"/></div>
          <div class="form-grp"><label class="form-lbl">البريد الإلكتروني</label>
          <input class="form-inp" type="email" id="r-email" placeholder="example@company.com"/></div>
          <div class="form-grp"><label class="form-lbl">كلمة المرور</label>
          <input class="form-inp" type="password" id="r-pass" placeholder="••••••••"/></div>
          <div class="form-grp"><label class="form-lbl">نوع الحساب</label>
          <select class="form-inp" id="r-role">
            <option value="employee">موظف (تقديم طلبات)</option>
            <option value="driver">سائق (تنفيذ رحلات)</option>
            <option value="admin">إداري (موافقة وتعيين)</option>
          </select></div>
          <button class="btn btn-green btn-full" onclick="doRegister()">إنشاء الحساب</button>
        `}
      </div>
    </div>
  </div>
</div>`;
}

function renderEmployee(){
  const u=S.user;
  const myR=S.reqs.filter(r=>r.empId===u.id);
  const modal=S.showModal?`<div class="modal-overlay"><div class="modal-box">
    <div class="modal-title">طلب سيارة جديدة</div>
    <div class="form-grp"><label class="form-lbl">من</label><input class="form-inp" id="m-from"/></div>
    <div class="form-grp"><label class="form-lbl">إلى</label><input class="form-inp" id="m-to"/></div>
    <div class="form-grp"><label class="form-lbl">السبب</label><textarea class="form-inp" id="m-reason"></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-sm" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-blue btn-sm" onclick="submitReq()">إرسال الطلب</button>
    </div>
  </div></div>`:'';
  return`${modal}
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-icon ic-b">🚗</div><div><div class="hdr-title">لوحة الموظف</div><div class="hdr-sub">${u.name}</div></div></div>
  <button class="btn btn-sm" onclick="logout()">خروج</button>
</div>
<div class="main">
  <button class="btn btn-blue" style="margin-bottom:12px" onclick="openModal()">+ طلب سيارة جديدة</button>
  <div class="card"><div class="card-body">${myR.map(r=>`<div class="req-item">
    <div class="req-row"><div>من: ${r.from} &rarr; ${r.to}</div>${bdg(r.status)}</div>
    ${r.driverName?`<div style="font-size:12px;color:#5F5E5A;margin-top:4px">السائق المسؤول: <b>${r.driverName}</b></div>`:''}
  </div>`).join('')||'<div class="empty">لا توجد طلبات</div>'}</div></div>
</div>`;
}

function renderAdmin(){
  const drivers = getAllUsers().filter(u => u.role === 'driver');
  return`
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-icon ic-p">🛡️</div><div><div class="hdr-title">لوحة الإداري</div></div></div>
  <button class="btn btn-sm" onclick="logout()">خروج</button>
</div>
<div class="main">
  <div class="card"><div class="card-body"><table>
    <thead><tr><th>الموظف</th><th>الوجهة</th><th>الحالة</th><th>السائق</th><th>إجراء</th></tr></thead>
    <tbody>${S.reqs.map(r=>`<tr>
      <td>${r.empName}</td>
      <td>${r.from} → ${r.to}</td>
      <td>${bdg(r.status)}</td>
      <td>${r.status==='pending'?`<select class="drv-sel" id="ds-${r.id}"><option value="">اختر سائق</option>${drivers.map(d=>`<option value="${d.id}">${d.name}</option>`).join('')}</select>`:(r.driverName||'—')}</td>
      <td>${r.status==='pending'?`<button class="btn btn-green btn-sm" onclick="approve('${r.id}')">موافقة وتحويل</button>`:'تم'}</td>
    </tr>`).join('')}</tbody>
  </table></div></div>
</div>`;
}

function renderDriver(){
  const u=S.user;
  const myR=S.reqs.filter(r=>r.driverId===u.id);
  return`
<div class="hdr">
  <div class="hdr-brand"><div class="hdr-icon ic-g">🚙</div><div><div class="hdr-title">لوحة السائق</div><div class="hdr-sub">${u.name}</div></div></div>
  <button class="btn btn-sm" onclick="logout()">خروج</button>
</div>
<div class="main">
  <div class="card"><div class="card-body">${myR.map(r=>`<div class="req-item">
    <div class="req-row"><div>من: ${r.from} &rarr; ${r.to} (الموظف: ${r.empName})</div>${bdg(r.status)}</div>
    ${r.status==='approved'?`<button class="btn btn-blue btn-full" style="margin-top:8px" onclick="startR('${r.id}')">▶ استلام الطلب وبدء الرحلة</button>`:''}
    ${r.status==='in_progress'?`<button class="btn btn-green btn-full" style="margin-top:8px" onclick="doneR('${r.id}')">✓ تم وصول الهدف وتنفيذ الطلب</button>`:''}
  </div>`).join('')||'<div class="empty">لا توجد رحلات حالياً</div>'}</div></div>
</div>`;
}

function setAuthMode(mode) {
  S.authMode = mode;
  S.msg = {err:'', ok:''};
  render();
}

function doLogin(){
  const email=document.getElementById('f-email')?.value.trim();
  const pass=document.getElementById('f-pass')?.value;
  const u = getAllUsers().find(x=>x.email===email && x.pass===pass);
  
  if(!u){
    S.msg={err:'البريد الإلكتروني أو كلمة المرور غير صحيحة'};
    render();
    return;
  }
  
  S.user=u;
  localStorage.setItem('car_app_user', JSON.stringify(u));
  requestNotifPermission();
  render();
}

async function doRegister(){
  const name = document.getElementById('r-name')?.value.trim();
  const email = document.getElementById('r-email')?.value.trim();
  const pass = document.getElementById('r-pass')?.value;
  const role = document.getElementById('r-role')?.value;

  if(!name || !email || !pass){
    S.msg = {err: 'يرجى ملء جميع الحقول المطلوبة'};
    render();
    return;
  }

  const existing = getAllUsers().find(x => x.email === email);
  if(existing){
    S.msg = {err: 'هذا البريد الإلكتروني مسجل بالفعل'};
    render();
    return;
  }

  try {
    const newUser = { name, email, pass, role };
    const docRef = await window.fb.addDoc(window.fb.collection(window.fb.db, "users"), newUser);
    newUser.id = docRef.id;

    S.user = newUser;
    localStorage.setItem('car_app_user', JSON.stringify(newUser));
    S.msg = {ok: 'تم إنشاء الحساب بنجاح!'};
    requestNotifPermission();
    render();
  } catch(e) {
    S.msg = {err: 'حدث خطأ أثناء الإنشاء: ' + e.message};
    render();
  }
}

function logout(){
  S.user=null;
  localStorage.removeItem('car_app_user');
  render();
}

function openModal(){S.showModal=true;render();}
function closeModal(){S.showModal=false;render();}

async function submitReq(){
  const from=document.getElementById('m-from')?.value.trim();
  const to=document.getElementById('m-to')?.value.trim();
  const reason=document.getElementById('m-reason')?.value.trim();
  if(!from||!to) return;
  try {
    await window.fb.addDoc(window.fb.collection(window.fb.db, "requests"), {
      empId: S.user.id,
      empName: S.user.name,
      from: from,
      to: to,
      reason: reason || '',
      status: 'pending',
      driverId: null,
      driverName: null,
      date: today()
    });
    S.showModal=false;
    render();
  } catch (e) {
    alert("حدث خطأ أثناء الإرسال: " + e.message);
  }
}

async function approve(rId){
  const sel=document.getElementById('ds-'+rId);
  const dId=sel?.value;
  if(!dId){alert('اختر سائق أولاً');return;}
  const d=getAllUsers().find(x=>x.id===dId);
  await window.fb.updateDoc(window.fb.doc(window.fb.db, "requests", rId), {
    status:'approved',driverId:dId,driverName:d?.name
  });
}

async function startR(rId){
  await window.fb.updateDoc(window.fb.doc(window.fb.db, "requests", rId), { status:'in_progress' });
}

async function doneR(rId){
  await window.fb.updateDoc(window.fb.doc(window.fb.db, "requests", rId), { status:'completed' });
}

render();
</script>
</body>
</html>
